<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人网站 | 首页</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- 导航栏 -->
    <nav class="navbar">
      <div class="logo">我的空间</div>
      <ul class="nav-links">
        <li><i class="fas fa-home"></i> 首页</li>
        <li><i class="fas fa-user"></i> 关于我</li>
        <li><i class="fas fa-code"></i> 项目</li>
        <li><i class="fas fa-blog"></i> 博客</li>
        <li><i class="fas fa-envelope"></i> 联系</li>
      </ul>
    </nav>

    <!-- 主要内容区 -->
    <main class="container">
      <section class="hero">
        <h1>欢迎来到我的个人空间</h1>
        <p>这里展示我的学习历程和项目作品</p>
        <div class="hero-buttons">了解我 查看项目</div>
      </section>

      <!-- 子网站快速入口 -->
      <section class="subsites-section">
        <h2>我的子网站</h2>
        <div class="subsites-grid">
          <div class="subsite-card">
            <div class="subsite-icon">
              <i class="fas fa-blog"></i>
            </div>
            <h3>技术博客</h3>
            <p>记录学习笔记和技术分享</p>
            进入博客
          </div>

          <div class="subsite-card">
            <div class="subsite-icon">
              <i class="fas fa-images"></i>
            </div>
            <h3>作品集</h3>
            <p>展示我的HTML/CSS作品</p>
            查看作品
          </div>

          <div class="subsite-card">
            <div class="subsite-icon">
              <i class="fas fa-file-alt"></i>
            </div>
            <h3>学习笔记</h3>
            <p>整理的学习资料和笔记</p>
            查看笔记
          </div>
        </div>
      </section>
    </main>

    <!-- 页脚 -->
    <footer>
      <p>© 2025 我的个人网站 | 托管在</p>
      <p>使用纯HTML + CSS构建</p>
    </footer>
  </body>
</html>
