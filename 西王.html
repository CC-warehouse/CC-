<!doctype html>

      body {

        height: 100vh;

      .head-box {
        background-color: #ded7d7;
        text-align: center;
        padding: 4px;
        width: 100%;
      }
      .gif1 {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin-bottom: 20px;
        margin: 5px auto;
      }
      .font-box {
        max-width: 100%;
        margin: 4px auto;
        padding: 20px;
        line-height: 1.8;
        color: red;
      }
      .gif-box {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin: 4px auto;
        gap: 2px;
      }

  <body>
    <div class="head-box">

    <div class="font-box">
      <p style="text-align: center">天生万物以养人，世人犹怨天不仁。</p>
      <p style="text-align: center">不知蝗蠹遍天下，苦尽苍生尽王臣。</p>
      <p style="text-align: center">人之生矣有贵贱，贵人长为天恩眷。</p>
      <p style="text-align: center">人生富贵总由天，草民之穷由天谴。</p>
      <p style="text-align: center">忽有狂徒夜磨刀，帝星飘摇荧惑高。</p>
      <p style="text-align: center">翻天覆地从今始，杀入何须惜手劳。</p>
      <p style="text-align: center">不忠之入曰可杀！不孝之入曰可杀！</p>
      <p style="text-align: center">不仁之入曰可杀！不义之入曰可杀！</p>
      <p style="text-align: center">不礼不智不信人，大西王曰杀杀杀！</p>
    </div>
    <div class="gif-box">
      <img
        src="images/大西王4.gif"

      <img

    <div
